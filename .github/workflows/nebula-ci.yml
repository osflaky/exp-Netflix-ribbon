name: "CI"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # test against JDK 8
        include:
        - java: 8
          os: windows-latest
          arch: x64
          runner: windows-latest
          expander_leg: windows-latest--x64
    name: CI with Java ${{ matrix.java }} [${{ matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v6
    - name: Setup jdk
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'zulu'
        architecture: ${{ matrix.arch }}
    - uses: actions/cache@v5
      id: gradle-cache
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ 
          hashFiles('**/gradle/dependency-locks/*.lockfile') }}
        restore-keys: |
          - ${{ runner.os }}-gradle-
    - uses: actions/cache@v5
      id: gradle-wrapper-cache
      with:
        path: ~/.gradle/wrapper
        key: ${{ runner.os }}-gradlewrapper-${{ hashFiles('gradle/wrapper/*') }}
        restore-keys: |
          - ${{ runner.os }}-gradlewrapper-
    - name: Build with Gradle
      run: ./gradlew --info --stacktrace build
      env:
        CI_NAME: github_actions
        CI_BUILD_NUMBER: ${{ github.sha }}
        CI_BUILD_URL: 'https://github.com/${{ github.repository }}'
        CI_BRANCH: ${{ github.ref }}
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 150
